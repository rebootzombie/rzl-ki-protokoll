name: RZL – Beiträge veröffentlichen
on:
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions: {}
concurrency:
  group: rzl-protokoll-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'rebootzombie/rzl-ki-protokoll' && ((github.event_name != 'issues' && github.event_name != 'issue_comment') || (github.event.issue.user.id == github.event.repository.owner.id && (github.event_name != 'issue_comment' || github.event.comment.user.id == github.event.repository.owner.id)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Stand laden
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Protokolltests
        run: node --test tests/*.test.cjs
      - name: Eingaben prüfen und versionieren
        run: node tools/publish-issues.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pages vorbereiten
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Öffentliches Artefakt hochladen
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .public
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Auslieferung bestätigen
        run: node tools/publish-issues.cjs confirm
        env:
          GH_TOKEN: ${{ github.token }}
